basePath: /api/v1
definitions:
  httpapi.CancelOrderRequest:
    properties:
      status:
        enum:
        - cancelled
        example: cancelled
        type: string
    required:
    - status
    type: object
  httpapi.CreateOrderRequest:
    properties:
      customer:
        example: Алиса
        minLength: 1
        type: string
    required:
    - customer
    type: object
  httpapi.ErrorResponse:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      error:
        example: customer is required
        type: string
    required:
    - code
    - error
    type: object
  httpapi.OrderResponse:
    properties:
      customer:
        example: Алиса
        type: string
      id:
        example: 1
        minimum: 1
        type: integer
      status:
        enum:
        - new
        - cancelled
        example: new
        type: string
    required:
    - customer
    - id
    - status
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  title: Swagger API
  version: "1.0"
paths:
  /orders:
    get:
      description: Возвращает список заказов с пагинацией.
      parameters:
      - default: 20
        description: Максимум заказов на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение для пагинации
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OrderResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получение списка заказов.
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Создаёт новый заказ и возвращает его ID.
      parameters:
      - description: Данные заказа
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: /api/v1/orders/{id}
              type: string
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Создание нового заказа.
      tags:
      - orders
  /orders/{id}:
    get:
      description: Возвращает заказ по ID.
      parameters:
      - description: ID заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Получение заказа по ID.
      tags:
      - orders
  /orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Переводит заказ из статуса new в cancelled.
      parameters:
      - description: ID заказа
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Новый статус заказа
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httpapi.CancelOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.OrderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Отменить заказ
      tags:
      - orders
  /status:
    get:
      description: Возвращает статус 200 к API.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Проверка статуса API.
      tags:
      - status
swagger: "2.0"
